<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado de Técnicos | ITExpresSolutions</title><link rel="icon" href="favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;color:#17324d;font-family:Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;border-radius:18px;box-shadow:0 7px 24px rgba(6,47,82,.08);padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:48px;height:48px;border-radius:12px}.brand h1{margin:0;color:#062f52;font-size:22px}button,a{border:0;border-radius:10px;padding:10px 14px;background:#087f8e;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tech{border:1px solid #e2ebef;border-radius:15px;padding:16px}.head{display:flex;justify-content:space-between;gap:10px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;background:#9aa7ae}.dot.on{background:#16a34a;box-shadow:0 0 0 5px #dcfce7}.name{font-weight:900;color:#062f52}.meta{font-size:13px;color:#6d808b;margin-top:5px}.time{font-size:12px;color:#80929d;margin-top:12px}.notice{display:none;padding:12px;border-radius:10px;background:#fff2ef;color:#a63225;margin-bottom:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="logo-badge.webp"><div><h1>Estado de Técnicos</h1><div class="meta">Disponibilidad en tiempo real</div></div></div><div><a href="/">← Portal</a> <button id="refresh">↻ Actualizar</button></div></div><div id="notice" class="notice"></div><section class="card"><div id="grid" class="grid"></div></section></div><script>const sb=supabase.createClient('https://wfdxbgohwejawmkpninz.supabase.co','sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb'),$=id=>document.getElementById(id);async function load(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='/?portal=1';const{data:me,error:pe}=await sb.from('public_profiles').select('rol,activo').eq('id',session.user.id).single();if(pe||!me||me.rol!=='admin'||!me.activo){$('notice').textContent='Solo administradores pueden ver el estado de técnicos.';$('notice').style.display='block';return}const{data,error}=await sb.from('public_profiles').select('id,nombre,email,telefono,especialidad,online,last_seen_at').eq('rol','tecnico').order('nombre');if(error){$('notice').textContent=error.message;$('notice').style.display='block';return}const now=Date.now();$('grid').innerHTML=(data||[]).map(t=>{const fresh=t.online&&t.last_seen_at&&(now-new Date(t.last_seen_at).getTime()<180000),online=!!fresh;return `<article class="tech"><div class="head"><div><div class="name">${esc(t.nombre||t.email)}</div><div class="meta">${esc(t.especialidad||'Soporte técnico')}</div></div><div><span class="dot ${online?'on':''}"></span><b>${online?'ONLINE':'OFFLINE'}</b></div></div><div class="meta">${esc(t.email||'')} ${t.telefono?' · '+esc(t.telefono):''}</div><div class="time">Última actividad: ${t.last_seen_at?new Date(t.last_seen_at).toLocaleString('es-MX'):'Sin registro'}</div></article>`}).join('')||'<div class="meta">No hay técnicos.</div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('refresh').onclick=load;load();setInterval(load,30000);</script></body></html>
