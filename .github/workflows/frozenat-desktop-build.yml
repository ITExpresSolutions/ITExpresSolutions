name: FrozeNat Desktop Build

on:
  push:
    branches:
      - frozenat-desktop-bootstrap
    paths:
      - 'desktop/**'
      - '.github/workflows/frozenat-desktop-build.yml'
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows installers
        run: npm run desktop:build
        env:
          VITE_SUPABASE_URL: ${{ secrets.FROZENAT_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FROZENAT_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: frozenat-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
