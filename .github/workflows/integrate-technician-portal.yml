name: Integrate technician dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route technicians from the main portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # The portal used to render the old technician dashboard first and
          # redirect only after a second auth/profile check. Redirect as soon
          # as the technician profile is known, before the old dashboard is
          # made visible. This prevents the visible page flash and eliminates
          # the need for a manual refresh.
          old = "currentUser=session.user; currentProfile=await loadProfile(currentUser);\n      loginCard.hidden=true; setPasswordCard.hidden=true; dashboard.hidden=false;"
          new = "currentUser=session.user; currentProfile=await loadProfile(currentUser);\n      if(currentProfile.rol==='tecnico'){ window.location.replace('/technician-dashboard.html'); return; }\n      loginCard.hidden=true; setPasswordCard.hidden=true; dashboard.hidden=false;"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not find the technician profile render point in index.html')

          # Keep a fallback route block for sessions that arrive at the portal
          # after an auth event without going through the normal login submit.
          marker = '<!-- ITX-TECHNICIAN-DASHBOARD-ROUTE -->'
          script = r'''<!-- ITX-TECHNICIAN-DASHBOARD-ROUTE -->
          <script>
          (function(){
            'use strict';
            var redirected=false;
            var checking=false;
            function route(){
              if(redirected || checking || location.pathname.endsWith('/technician-dashboard.html')) return;
              var sb=window.ITExpresSupabase;
              if(!sb || !sb.auth) return;
              checking=true;
              sb.auth.getSession().then(function(result){
                var session=result && result.data && result.data.session;
                if(!session || !session.user || redirected) return null;
                return sb.from('public_profiles').select('rol').eq('id',session.user.id).maybeSingle();
              }).then(function(result){
                if(!result || !result.data || redirected) return;
                if(String(result.data.rol || '').toLowerCase()==='tecnico'){
                  redirected=true;
                  location.replace('/technician-dashboard.html');
                }
              }).catch(function(err){ console.debug('Technician routing:',err); }).finally(function(){ checking=false; });
            }
            function boot(){
              route();
              window.addEventListener('load',route);
              if(window.ITExpresSupabase && window.ITExpresSupabase.auth){
                window.ITExpresSupabase.auth.onAuthStateChange(function(event){
                  if(event==='SIGNED_IN' || event==='INITIAL_SESSION') route();
                });
              }
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
            window.addEventListener('hashchange',route);
          })();
          </script>'''

          if marker in text:
              start = text.index(marker)
              end = text.find('</script>', start)
              if end == -1:
                  raise SystemExit('Existing technician routing block is incomplete.')
              end += len('</script>')
              text = text[:start] + script + text[end:]
          else:
              if '</body>' not in text:
                  raise SystemExit('index.html does not contain </body>')
              text = text.replace('</body>', script + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Route technicians before portal render'
          git push
