name: Integrate technician dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route technicians from the main portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- ITX-TECHNICIAN-DASHBOARD-ROUTE -->'
          if marker in text:
              print('Technician routing already installed.')
              raise SystemExit(0)

          script = r'''<!-- ITX-TECHNICIAN-DASHBOARD-ROUTE -->
          <script>
          (function(){
            'use strict';
            var redirected=false;
            function route(){
              if(redirected || location.pathname.endsWith('/technician-dashboard.html')) return;
              var sb=window.ITExpresSupabase;
              if(!sb || !sb.auth) return;
              sb.auth.getSession().then(function(result){
                var session=result && result.data && result.data.session;
                if(!session || !session.user || redirected) return;
                return sb.from('public_profiles').select('rol').eq('id',session.user.id).maybeSingle();
              }).then(function(result){
                if(!result || !result.data || redirected) return;
                if(String(result.data.rol || '').toLowerCase()==='tecnico'){
                  redirected=true;
                  location.replace('/technician-dashboard.html');
                }
              }).catch(function(err){ console.debug('Technician routing:',err); });
            }
            function boot(){
              route();
              setTimeout(route,800);
              setTimeout(route,1800);
              setTimeout(route,3500);
              setTimeout(route,6000);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
            window.addEventListener('hashchange',route);
          })();
          </script>'''
          script = script.replace('          <script>', '          <script>')
          # Insert immediately before </body> so the existing application remains intact.
          if '</body>' not in text:
              raise SystemExit('index.html does not contain </body>')
          text = text.replace('</body>', script + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Route technicians to technician dashboard'
          git push
