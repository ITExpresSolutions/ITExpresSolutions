name: Integrate ticket bot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ticket bot script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ticket-bot.js" defer></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace('</body>', f'  {tag}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration and remove temporary workflow
        run: |
          rm -f .github/workflows/integrate-ticket-bot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/integrate-ticket-bot.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: connect service bot to ticket flow"
          git push
