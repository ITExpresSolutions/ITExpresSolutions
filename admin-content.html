<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contenido Interno | ITExpresSolutions</title><link rel="icon" href="favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;color:#17324d;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px}.top,.card{background:#fff;border-radius:18px;box-shadow:0 7px 24px rgba(6,47,82,.08)}.top{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:12px}.brand h1{margin:0;color:#062f52;font-size:22px}.muted{color:#718590;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{border:0;border-radius:10px;padding:10px 14px;background:#087f8e;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.secondary{background:#eef6f8!important;color:#062f52!important}.danger{background:#b42318}.ghost{background:#eef6f8;color:#062f52}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px;margin-bottom:16px}.card h2{margin:0 0 14px;color:#062f52;font-size:18px}.form{display:grid;gap:9px}.form input,.form textarea{width:100%;box-sizing:border-box;border:1px solid #d5e2e8;border-radius:9px;padding:10px;font:inherit}.form textarea{min-height:120px}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#607887}.check input{width:auto}.list{display:grid;gap:9px;margin-top:14px}.item{border:1px solid #e2ebef;border-radius:12px;padding:12px}.item strong{color:#062f52}.item small{display:block;color:#718590;margin-top:5px}.item .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.notice{display:none;padding:12px;border-radius:10px;background:#fff2ef;color:#a63225;margin-bottom:12px}.success{background:#edf9f3;color:#087f62}.full{grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><img src="logo-badge.webp"><div><h1>Contenido interno</h1><div class="muted">Knowledge Base · Documentación · Noticias corporativas</div></div></div><div class="actions"><a class="btn secondary" href="/admin-reports.html">📊 Reportes</a><a class="btn secondary" href="/admin-technicians.html">👨‍🔧 Técnicos</a><a class="btn secondary" href="/">← Portal</a><button id="logout">Salir</button></div></header><div id="notice" class="notice"></div><div class="grid"><section class="card"><h2>📚 Nuevo artículo Knowledge Base</h2><form id="kbForm" class="form"><input id="kbTitle" placeholder="Título" required><input id="kbCat" placeholder="Categoría" value="General"><input id="kbSummary" placeholder="Resumen"><textarea id="kbContent" placeholder="Contenido / procedimiento" required></textarea><input id="kbTags" placeholder="Etiquetas separadas por coma"><label class="check"><input type="checkbox" id="kbPublished" checked> Publicar inmediatamente</label><button type="submit">Publicar artículo</button></form><div class="list" id="kbList"></div></section><section class="card"><h2>🏢 Nueva documentación</h2><form id="docForm" class="form"><input id="docTitle" placeholder="Título" required><input id="docCat" placeholder="Categoría" value="Empresa"><input id="docDesc" placeholder="Descripción"><input id="docUrl" type="url" placeholder="Enlace al documento (opcional)"><textarea id="docContent" placeholder="Contenido interno (opcional)"></textarea><label class="check"><input type="checkbox" id="docPublished" checked> Publicar inmediatamente</label><button type="submit">Publicar documento</button></form><div class="list" id="docList"></div></section><section class="card full"><h2>📰 Nueva noticia corporativa</h2><form id="newsForm" class="form"><input id="newsTitle" placeholder="Título de la noticia" required><input id="newsSummary" placeholder="Resumen breve"><textarea id="newsContent" placeholder="Contenido de la noticia" required></textarea><input id="newsUrl" type="url" placeholder="Enlace externo (opcional)"><label class="check"><input type="checkbox" id="newsPublished" checked> Publicar inmediatamente para los técnicos</label><button type="submit">📰 Publicar noticia</button></form><div class="list" id="newsList"></div></section></div></div><script>const sb=supabase.createClient('https://wfdxbgohwejawmkpninz.supabase.co','sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function notice(t,ok=false){$('notice').textContent=t;$('notice').className='notice '+(ok?'success':'');$('notice').style.display='block'}async function auth(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/?portal=1';return false}const{data:p,error}=await sb.from('public_profiles').select('rol,activo').eq('id',session.user.id).single();if(error||!p||p.rol!=='admin'||!p.activo){notice('Solo administradores pueden gestionar este contenido.');return false}return true}function item(t,id,title,meta,published){return `<div class="item"><div class="row"><div><strong>${esc(title)}</strong><small>${esc(meta)} · ${published?'Publicado':'Oculto'}</small></div><div><button class="ghost" onclick="toggle('${t}','${id}',${!published})">${published?'Ocultar':'Publicar'}</button> <button class="danger" onclick="del('${t}','${id}')">Eliminar</button></div></div></div>`}async function load(){const[k,d,n]=await Promise.all([sb.from('knowledge_base').select('id,titulo,categoria,publicado').order('updated_at',{ascending:false}),sb.from('company_documents').select('id,titulo,categoria,publicado').order('updated_at',{ascending:false}),sb.from('company_news').select('id,titulo,publicado').order('publicado_at',{ascending:false})]);const bad=[k,d,n].find(x=>x.error);if(bad){notice('No se pudo cargar contenido: '+bad.error.message);return}$('kbList').innerHTML=(k.data||[]).map(x=>item('knowledge_base',x.id,x.titulo,x.categoria||'General',x.publicado)).join('')||'<div class="muted">No hay artículos.</div>';$('docList').innerHTML=(d.data||[]).map(x=>item('company_documents',x.id,x.titulo,x.categoria||'Empresa',x.publicado)).join('')||'<div class="muted">No hay documentos.</div>';$('newsList').innerHTML=(n.data||[]).map(x=>item('company_news',x.id,x.titulo,'Noticia corporativa',x.publicado)).join('')||'<div class="muted">No hay noticias todavía.</div>'}window.toggle=async(t,id,published)=>{const{error}=await sb.from(t).update({publicado}).eq('id',id);if(error)notice(error.message);else{notice(published?'Contenido publicado para los técnicos.':'Contenido ocultado.',true);load()}};window.del=async(t,id)=>{if(!confirm('¿Eliminar este contenido?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)notice(error.message);else load()};$('kbForm').onsubmit=async e=>{e.preventDefault();const u=(await sb.auth.getUser()).data.user;const{error}=await sb.from('knowledge_base').insert({titulo:$('kbTitle').value,categoria:$('kbCat').value,resumen:$('kbSummary').value,contenido:$('kbContent').value,tags:$('kbTags').value.split(',').map(x=>x.trim()).filter(Boolean),publicado:$('kbPublished').checked,created_by:u.id});if(error)notice(error.message);else{e.target.reset();$('kbPublished').checked=true;notice('Artículo guardado correctamente.',true);load()}};$('docForm').onsubmit=async e=>{e.preventDefault();const u=(await sb.auth.getUser()).data.user;const{error}=await sb.from('company_documents').insert({titulo:$('docTitle').value,categoria:$('docCat').value,descripcion:$('docDesc').value,url:$('docUrl').value||null,contenido:$('docContent').value||null,publicado:$('docPublished').checked,created_by:u.id});if(error)notice(error.message);else{e.target.reset();$('docPublished').checked=true;notice('Documento guardado correctamente.',true);load()}};$('newsForm').onsubmit=async e=>{e.preventDefault();const u=(await sb.auth.getUser()).data.user;const{error}=await sb.from('company_news').insert({titulo:$('newsTitle').value,resumen:$('newsSummary').value,contenido:$('newsContent').value,url:$('newsUrl').value||null,publicado:$('newsPublished').checked,created_by:u.id});if(error)notice(error.message);else{e.target.reset();$('newsPublished').checked=true;notice('Noticia publicada correctamente y visible para técnicos.',true);load()}};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/'};(async()=>{if(await auth())load()})();</script></body></html>
