<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contenido Interno | ITExpresSolutions</title><link rel="icon" href="favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;color:#17324d;font-family:Arial}.wrap{max-width:1150px;margin:auto;padding:22px}.top,.card{background:#fff;border-radius:18px;box-shadow:0 7px 24px rgba(6,47,82,.08)}.top{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:12px}.brand h1{margin:0;color:#062f52;font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{border:0;border-radius:10px;padding:10px 14px;background:#087f8e;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px;margin-bottom:16px}.card h2{margin:0 0 14px;color:#062f52;font-size:18px}.form{display:grid;gap:9px}.form input,.form textarea{width:100%;box-sizing:border-box;border:1px solid #d5e2e8;border-radius:9px;padding:10px;font:inherit}.form textarea{min-height:120px}.list{display:grid;gap:9px;margin-top:14px}.item{border:1px solid #e2ebef;border-radius:12px;padding:12px}.item strong{color:#062f52}.item small{display:block;color:#718590;margin-top:5px}.danger{background:#b42318}.notice{display:none;padding:12px;border-radius:10px;background:#fff2ef;color:#a63225;margin-bottom:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><img src="logo-badge.webp"><div><h1>Contenido interno</h1><div style="color:#718590;font-size:13px">Knowledge Base · Documentación · Noticias</div></div></div><div class="actions"><a href="/">← Portal</a><button id="logout">Salir</button></div></header><div id="notice" class="notice"></div><div class="grid"><section class="card"><h2>📚 Nuevo artículo Knowledge Base</h2><form id="kbForm" class="form"><input id="kbTitle" placeholder="Título" required><input id="kbCat" placeholder="Categoría" value="General"><input id="kbSummary" placeholder="Resumen"><textarea id="kbContent" placeholder="Contenido / procedimiento" required></textarea><input id="kbTags" placeholder="Etiquetas separadas por coma"><button>Publicar artículo</button></form><div class="list" id="kbList"></div></section><section class="card"><h2>🏢 Nueva documentación</h2><form id="docForm" class="form"><input id="docTitle" placeholder="Título" required><input id="docCat" placeholder="Categoría" value="Empresa"><input id="docDesc" placeholder="Descripción"><input id="docUrl" type="url" placeholder="Enlace al documento (opcional)"><textarea id="docContent" placeholder="Contenido interno (opcional)"></textarea><button>Publicar documento</button></form><div class="list" id="docList"></div></section><section class="card"><h2>📰 Nueva noticia corporativa</h2><form id="newsForm" class="form"><input id="newsTitle" placeholder="Título" required><input id="newsSummary" placeholder="Resumen"><textarea id="newsContent" placeholder="Contenido" required></textarea><input id="newsUrl" type="url" placeholder="Enlace externo (opcional)"><button>Publicar noticia</button></form><div class="list" id="newsList"></div></section></div></div><script>const sb=supabase.createClient('https://wfdxbgohwejawmkpninz.supabase.co','sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function auth(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='/?portal=1';const{data:p}=await sb.from('public_profiles').select('rol,activo').eq('id',session.user.id).single();if(!p||p.rol!=='admin'||!p.activo){$('notice').textContent='Solo administradores pueden gestionar este contenido.';$('notice').style.display='block';return false}return true}async function load(){let[{data:k},{data:d},{data:n}]=await Promise.all([sb.from('knowledge_base').select('id,titulo,categoria,publicado').order('updated_at',{ascending:false}),sb.from('company_documents').select('id,titulo,categoria,publicado').order('updated_at',{ascending:false}),sb.from('company_news').select('id,titulo,publicado').order('publicado_at',{ascending:false})]);$('kbList').innerHTML=(k||[]).map(x=>`<div class="item"><strong>${esc(x.titulo)}</strong><small>${esc(x.categoria)} · ${x.publicado?'Publicado':'Oculto'} <button class="danger" onclick="del('knowledge_base','${x.id}')">Eliminar</button></small></div>`).join('');$('docList').innerHTML=(d||[]).map(x=>`<div class="item"><strong>${esc(x.titulo)}</strong><small>${esc(x.categoria)} · ${x.publicado?'Publicado':'Oculto'} <button class="danger" onclick="del('company_documents','${x.id}')">Eliminar</button></small></div>`).join('');$('newsList').innerHTML=(n||[]).map(x=>`<div class="item"><strong>${esc(x.titulo)}</strong><small>${x.publicado?'Publicado':'Oculto'} <button class="danger" onclick="del('company_news','${x.id}')">Eliminar</button></small></div>`).join('')}window.del=async(t,id)=>{if(!confirm('¿Eliminar este contenido?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);else load()};$('kbForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('knowledge_base').insert({titulo:$('kbTitle').value,categoria:$('kbCat').value,resumen:$('kbSummary').value,contenido:$('kbContent').value,tags:$('kbTags').value.split(',').map(x=>x.trim()).filter(Boolean),created_by:(await sb.auth.getUser()).data.user.id});if(error)alert(error.message);else{e.target.reset();load()}};$('docForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('company_documents').insert({titulo:$('docTitle').value,categoria:$('docCat').value,descripcion:$('docDesc').value,url:$('docUrl').value||null,contenido:$('docContent').value||null,created_by:(await sb.auth.getUser()).data.user.id});if(error)alert(error.message);else{e.target.reset();load()}};$('newsForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('company_news').insert({titulo:$('newsTitle').value,resumen:$('newsSummary').value,contenido:$('newsContent').value,url:$('newsUrl').value||null,created_by:(await sb.auth.getUser()).data.user.id});if(error)alert(error.message);else{e.target.reset();load()}};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/'};(async()=>{if(await auth())load()})();</script></body></html>
