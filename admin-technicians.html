<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Técnicos | ITExpresSolutions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;font-family:Arial;color:#17324d}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;box-shadow:0 6px 22px #062f5212;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{color:#062f52}.tech{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid #e5edf1}.tech:last-child{border-bottom:0}.name{font-weight:800}.online{color:#087f62;font-weight:800}.offline{color:#71808a;font-weight:800}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#087f62}.dot.off{background:#8999a2}button{border:0;border-radius:9px;padding:9px 13px;background:#087f8e;color:#fff;font-weight:bold;cursor:pointer}.error{background:#fff3f0;color:#9b2c1f;border:1px solid #ffd6ce;padding:12px;border-radius:10px}@media(max-width:700px){.tech{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>👨‍🔧 Técnicos en línea</h1><div>Supervisión en tiempo real</div></div><button id="refresh">↻ Actualizar</button></div><section class="card"><div id="list">Cargando…</div></section></main><script>const URL='https://wfdxbgohwejawmkpninz.supabase.co',KEY='sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb',db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='/';return}const{data:profile,error:pe}=await db.from('public_profiles').select('rol,activo').eq('id',user.id).maybeSingle();if(pe){$('list').innerHTML='<div class="error">No se pudo verificar el administrador: '+esc(pe.message)+'</div>';return}if(profile?.rol!=='admin'||profile?.activo!==true){$('list').textContent='Acceso solo para administradores.';return}const{data,error}=await db.from('technician_presence').select('technician_id,status,last_seen_at,updated_at').order('last_seen_at',{ascending:false});if(error){$('list').innerHTML='<div class="error">No se pudo cargar presencia: '+esc(error.message)+'</div>';return}const ids=(data||[]).map(x=>x.technician_id);let profiles=[];if(ids.length){const r=await db.from('public_profiles').select('id,nombre,email,especialidad').in('id',ids);if(r.error){$('list').innerHTML='<div class="error">No se pudieron cargar los técnicos: '+esc(r.error.message)+'</div>';return}profiles=r.data||[]}const byId=Object.fromEntries(profiles.map(p=>[p.id,p]));const now=Date.now();$('list').innerHTML=(data||[]).map(x=>{const p=byId[x.technician_id]||{},active=x.status==='online'&&x.last_seen_at&&now-new Date(x.last_seen_at).getTime()<180000;return `<div class="tech"><div><div class="name">${esc(p.nombre||p.email||x.technician_id)}</div><div>${p.especialidad?esc(p.especialidad):''}</div><div class="${active?'online':'offline'}"><span class="dot ${active?'':'off'}"></span>${active?'ONLINE':'OFFLINE'}</div></div><div>${x.last_seen_at?'Última actividad: '+new Date(x.last_seen_at).toLocaleString('es-MX'):'Sin actividad'}</div></div>`}).join('')||'No hay técnicos registrados en presencia.'}$('refresh').onclick=load;load();setInterval(load,30000)</script></body></html>
