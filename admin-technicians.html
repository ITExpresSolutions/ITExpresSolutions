<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Técnicos | ITExpresSolutions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;font-family:Arial;color:#17324d}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;box-shadow:0 6px 22px #062f5212;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{color:#062f52}.tech{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid #e5edf1}.tech:last-child{border-bottom:0}.name{font-weight:800;font-size:18px;color:#062f52}.email,.muted{color:#71808a}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.account-active{background:#e5f7ed;color:#087f62}.account-inactive{background:#fff0ed;color:#a63225}.online{background:#e5f7ed;color:#087f62}.offline{background:#eef2f4;color:#607887}.dot{width:9px;height:9px;border-radius:50%;background:#087f62}.dot.off{background:#8999a2}.last{font-size:12px;color:#71808a;text-align:right;line-height:1.5}button{border:0;border-radius:9px;padding:9px 13px;background:#087f8e;color:#fff;font-weight:bold;cursor:pointer}.error{background:#fff3f0;color:#9b2c1f;border:1px solid #ffd6ce;padding:12px;border-radius:10px}@media(max-width:700px){.tech{grid-template-columns:1fr}.last{text-align:left}}</style></head><body><main class="wrap"><div class="top"><div><h1>👨‍🔧 Técnicos</h1><div class="muted">Cuenta y disponibilidad en tiempo real</div></div><button id="refresh">↻ Actualizar</button></div><section class="card"><div id="list">Cargando…</div></section></main><script>const db=supabase.createClient('https://wfdxbgohwejawmkpninz.supabase.co','sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='/';return}const{data:me,error:pe}=await db.from('public_profiles').select('rol,activo').eq('id',user.id).maybeSingle();if(pe){$('list').innerHTML='<div class="error">No se pudo verificar el administrador: '+esc(pe.message)+'</div>';return}if(me?.rol!=='admin'||me?.activo!==true){$('list').textContent='Acceso solo para administradores.';return}const{data,error}=await db.from('public_profiles').select('id,nombre,email,especialidad,activo,online,last_seen_at').eq('rol','tecnico').order('nombre');if(error){$('list').innerHTML='<div class="error">No se pudieron cargar los técnicos: '+esc(error.message)+'</div>';return}const now=Date.now();$('list').innerHTML=(data||[]).map(p=>{const fresh=p.online===true&&p.last_seen_at&&now-new Date(p.last_seen_at).getTime()<180000;const account=p.activo===true;return `<div class="tech"><div><div class="name">${esc(p.nombre||p.email||p.id)}</div><div class="email">${esc(p.email||'')}</div><div class="muted">${esc(p.especialidad||'Soporte técnico')}</div><div class="badges"><span class="badge ${account?'account-active':'account-inactive'}">${account?'✓ Cuenta activa':'✕ Cuenta inactiva'}</span><span class="badge ${fresh?'online':'offline'}"><span class="dot ${fresh?'':'off'}"></span>${fresh?'EN LÍNEA':'DESCONectado'.toUpperCase()}</span></div></div><div class="last">${p.last_seen_at?'Última actividad:<br>'+new Date(p.last_seen_at).toLocaleString('es-MX'):'Sin actividad registrada'}</div></div>`}).join('')||'No hay técnicos registrados.')}$('refresh').onclick=load;load();setInterval(load,30000)</script></body></html>
