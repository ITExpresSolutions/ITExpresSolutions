<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Técnicos | ITExpresSolutions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;font-family:Arial;color:#17324d}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;box-shadow:0 6px 22px #062f5212;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{color:#062f52}.tech{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid #e5edf1}.tech:last-child{border-bottom:0}.name{font-weight:800}.online{color:#087f62;font-weight:800}.offline{color:#71808a;font-weight:800}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#087f62}.dot.off{background:#8999a2}button{border:0;border-radius:9px;padding:9px 13px;background:#087f8e;color:#fff;font-weight:bold;cursor:pointer}</style></head><body><main class="wrap"><div class="top"><div><h1>👨‍🔧 Técnicos en línea</h1><div>Supervisión en tiempo real</div></div><button id="refresh">↻ Actualizar</button></div><section class="card"><div id="list">Cargando…</div></section></main><script>const URL='https://wfdxbgohwejawmkpninz.supabase.co',KEY='sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb',db=supabase.createClient(URL,KEY);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='/';return}const{data:profile}=await db.from('public_profiles').select('rol,activo').eq('id',user.id).maybeSingle();if(profile?.rol!=='admin'||profile?.activo!==true){document.getElementById('list').textContent='Acceso solo para administradores.';return}const{data,error}=await db.from('technician_presence').select('technician_id,status,last_seen_at,updated_at,public_profiles(nombre,email)').order('status',{ascending:false}).order('last_seen_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}const now=Date.now();document.getElementById('list').innerHTML=(data||[]).map(x=>{const active=x.status==='online'&&now-new Date(x.last_seen_at).getTime()<180000;return `<div class="tech"><div><div class="name">${esc(x.public_profiles?.nombre||x.public_profiles?.email||x.technician_id)}</div><div class="${active?'online':'offline'}"><span class="dot ${active?'':'off'}"></span>${active?'ONLINE':'OFFLINE'}</div></div><div>${x.last_seen_at?'Última actividad: '+new Date(x.last_seen_at).toLocaleString('es-MX'):'Sin actividad'}</div></div>`}).join('')||'No hay técnicos registrados en presencia.'}document.getElementById('refresh').onclick=load;load();setInterval(load,30000)</script></body></html>
