Técnicos</h1><div class="muted">Todos los técnicos y su disponibilidad</div></div><div><a href="/admin-dashboard.html">📊 Dashboard</a><a class="btn secondary" href="/#portal">← Portal</a> <a href="/admin-server.html">🖥️ Estado del sistema</a> <button id="refresh">↻ Actualizar</button></div></div><section class="card"><div id="summary" class="summary"><span>👥 Técnicos: —</span></div><div id="list">Cargando técnicos…</div></section></main><script>const db=supabase.createClient('https://wfdxbgohwejawmkpninz.supabase.co','sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='/';return}const{data:me,error:pe}=await db.from('public_profiles').select('rol,activo').eq('id',user.id).maybeSingle();if(pe){$('list').innerHTML='<div class="error">No se pudo verificar el administrador: '+esc(pe.message)+'</div>';return}if(me?.rol!=='admin'||me?.activo!==true){$('list').textContent='Acceso solo para administradores.';return}const[{data,error:profileError},{data:presenceData,error:presenceError}]=await Promise.all([db.from('public_profiles').select('id,nombre,email,especialidad,activo').eq('rol','tecnico').order('nombre'),db.from('technician_presence').select('technician_id,status,last_seen_at').order('last_seen_at',{ascending:false})]);if(profileError){$('list').innerHTML='<div class="error">No se pudieron cargar los técnicos: '+esc(profileError.message)+'</div>';return}if(presenceError){$('list').innerHTML='<div class="error">No se pudo cargar la disponibilidad: '+esc(presenceError.message)+'</div>';return}const presenceById=new Map((presenceData||[]).map(x=>[x.technician_id,x]));const now=Date.now();const technicians=data||[];let online=0;const html=technicians.map(p=>{const pr=presenceById.get(p.id);const lastMs=pr?.last_seen_at?new Date(pr.last_seen_at).getTime():0;const fresh=pr?.status==='online'&&lastMs>0&&Number.isFinite(lastMs)&&now-lastMs<180000;if(fresh)online++;const account=p.activo===true;return `<div class="tech"><div><div class="name">${esc(p.nombre||p.email||p.id)}</div><div class="email">${esc(p.email||'')}</div><div class="muted">${esc(p.especialidad||'Soporte técnico')}</div><div class="badges"><span class="badge ${account?'account-active':'account-inactive'}">${account?'✓ Cuenta activa':'✕ Cuenta inactiva'}</span><span class="badge ${fresh?'online':'offline'}"><span class="dot ${fresh?'':'off'}"></span>${fresh?'EN LÍNEA':'DESCONECTADO'}</span></div></div><div class="last">${pr?.last_seen_at?'Última actividad:<br>'+new Date(pr.last_seen_at).toLocaleString('es-MX'):'Sin actividad registrada'}</div></div>`}).join('');$('summary').innerHTML=`<span>👥 Técnicos: ${technicians.length}</span><span class="s-online">🟢 En línea: ${online}</span><span class="s-offline">⚪ Desconectados: ${technicians.length-online}</span>`;$('list').innerHTML=html||'No hay técnicos registrados.'}$('refresh').onclick=load;load();setInterval(load,30000)</script></body></html>
