<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Técnico | ITExpresSolutions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f7fa;font-family:Arial;color:#17324d}.wrap{max-width:1200px;margin:auto;padding:20px}.top,.card{background:#fff;border-radius:16px;box-shadow:0 6px 22px #062f5212;padding:18px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:48px;height:48px;border-radius:12px}h1,h2{color:#062f52}.brand h1{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.toolbar label{font-size:12px;font-weight:bold;display:flex;flex-direction:column;gap:4px}.toolbar input{padding:9px;border:1px solid #d8e4ea;border-radius:8px}button{border:0;border-radius:9px;padding:10px 14px;background:#087f8e;color:white;font-weight:bold;cursor:pointer}.offline{background:#e9eef1;color:#17324d}.presence{padding:12px;border-radius:12px;background:#f4fafb}.item{border-top:1px solid #e5edf1;padding:12px 0}.item:first-child{border-top:0}.muted{color:#607887;font-size:13px}.search{width:100%;padding:11px;border:1px solid #d8e4ea;border-radius:9px;margin-bottom:8px;box-sizing:border-box}.tag{display:inline-block;background:#eef6f8;border-radius:20px;padding:4px 8px;font-size:11px;margin:2px}.online{color:#087f62}.off{color:#71808a}.error{background:#fff3f0;color:#9b2c1f;border:1px solid #ffd6ce;padding:12px;border-radius:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="logo-badge.webp"><div><h1>Panel Técnico</h1><div class="muted">Historial · Knowledge Base · Documentación · Noticias</div></div></div><div><button id="online">🟢 Ponme online</button> <button id="offline" class="offline">⚪ Offline</button></div></header><section class="card"><div class="presence">Mi estado: <strong id="mine">Cargando…</strong> <span class="muted" id="seen"></span></div></section><section class="card"><h2>🎫 Tickets previos</h2><div class="toolbar"><label>Desde<input type="date" id="from"></label><label>Hasta<input type="date" id="to"></label><button id="filter">Buscar</button></div><div id="tickets" class="muted" style="margin-top:12px">Cargando…</div></section><div class="grid"><section class="card"><h2>📚 Knowledge Base</h2><input class="search" id="kbSearch" placeholder="Buscar procedimientos, errores, soluciones…"><div id="kb"></div></section><section class="card"><h2>🏢 Documentación</h2><input class="search" id="docSearch" placeholder="Buscar documentos…"><div id="docs"></div></section></div><section class="card"><h2>📰 Noticias corporativas</h2><div id="news"></div></section></main><script>const URL='https://wfdxbgohwejawmkpninz.supabase.co',KEY='sb_publishable_SxcHBgFdBO4O6Aq1wQAU7A_BCJN98yb',db=window.supabase.createClient(URL,KEY);let me=null,heartbeat=null;const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function auth(){const{data,error}=await db.auth.getUser();if(error||!data.user){location.href='/';return null}me=data.user;return me}async function setPresence(status){if(!me)return;const payload={technician_id:me.id,status,last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()};const{error}=await db.from('technician_presence').upsert(payload,{onConflict:'technician_id'});if(error){$('mine').innerHTML='<span class="error">No se pudo actualizar estado: '+esc(error.message)+'</span>';return}$('mine').innerHTML=status==='online'?'<span class="online">🟢 ONLINE</span>':'<span class="off">⚪ OFFLINE</span>';$('seen').textContent='Última actividad: ahora';if(heartbeat)clearInterval(heartbeat);if(status==='online')heartbeat=setInterval(()=>setPresence('online'),60000)}async function tickets(){if(!me)return;let q=db.from('trabajos').select('id,titulo,descripcion,cliente_nombre,cliente_email,prioridad,estado,tecnico_id,fecha_programada,creado_at,actualizado_at,completado_at,tipo_servicio').eq('tecnico_id',me.id).order('creado_at',{ascending:false});if($('from').value)q=q.gte('creado_at',$('from').value+'T00:00:00');if($('to').value)q=q.lte('creado_at',$('to').value+'T23:59:59');const{data,error}=await q;if(error){$('tickets').innerHTML='<div class="error">No se pudo cargar el historial: '+esc(error.message)+'</div>';return}$('tickets').innerHTML=data?.length?data.map(t=>`<div class="item"><b>#${esc(String(t.id).slice(0,8).toUpperCase())}</b> · ${esc(t.estado||'—')} · ${esc(t.prioridad||'—')}<div>${esc(t.titulo||'Sin título')}</div><div class="muted">${t.creado_at?new Date(t.creado_at).toLocaleString('es-MX'):''}${t.completado_at?' · Completado: '+new Date(t.completado_at).toLocaleString('es-MX'):''}</div></div>`).join(''):'No hay tickets en ese período.'}async function loadContent(){const specs=[{table:'knowledge_base',out:'kb',search:'kbSearch',published:'publicado',title:'titulo',category:'categoria',summary:'resumen',content:'contenido',date:'updated_at',label:'Knowledge Base'},{table:'company_documents',out:'docs',search:'docSearch',published:'publicado',title:'titulo',category:'categoria',summary:'descripcion',content:'contenido',date:'updated_at',label:'Documentación'}];for(const s of specs){const{data,error}=await db.from(s.table).select('*').eq(s.published,true).order(s.date,{ascending:false});if(error){$(s.out).innerHTML='<div class="error">No se pudo cargar '+s.label+': '+esc(error.message)+'</div>';continue}const render=()=>{const term=$(s.search).value.toLowerCase();const rows=(data||[]).filter(x=>`${x[s.title]||''} ${x[s.category]||''} ${x[s.content]||''} ${x[s.summary]||''}`.toLowerCase().includes(term));$(s.out).innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x[s.title])}</b>${x[s.category]?` <span class="tag">${esc(x[s.category])}</span>`:''}<div class="muted">${esc(x[s.summary]||x[s.content]||'')}</div>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Abrir documento →</a>`:''}</div>`).join(''):`No hay ${s.label.toLowerCase()} publicados.`};$(s.search).oninput=render;render()}const{data,error}=await db.from('company_news').select('*').eq('publicado',true).order('publicado_at',{ascending:false}).limit(20);if(error){$('news').innerHTML='<div class="error">No se pudieron cargar las noticias: '+esc(error.message)+'</div>';return}$('news').innerHTML=data?.length?data.map(x=>`<div class="item"><b>${esc(x.titulo)}</b><div class="muted">${x.publicado_at?new Date(x.publicado_at).toLocaleDateString('es-MX'):''}</div><p>${esc(x.resumen||x.contenido||'')}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Leer noticia →</a>`:''}</div>`).join(''):'No hay noticias publicadas.'}async function init(){await auth();if(!me)return;const today=new Date(),ago=new Date(today);ago.setDate(ago.getDate()-30);$('from').value=ago.toISOString().slice(0,10);$('to').value=today.toISOString().slice(0,10);await tickets();await loadContent();const{data,error}=await db.from('technician_presence').select('status,last_seen_at').eq('technician_id',me.id).maybeSingle();if(error){$('mine').innerHTML='<span class="error">No se pudo leer el estado: '+esc(error.message)+'</span>'}else if(data?.status==='online')setPresence('online');else $('mine').innerHTML='<span class="off">⚪ OFFLINE</span>'}$('online').onclick=()=>setPresence('online');$('offline').onclick=()=>setPresence('offline');$('filter').onclick=tickets;init();</script></body></html>
