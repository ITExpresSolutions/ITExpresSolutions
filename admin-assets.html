<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activos e Inventario | ITExpresSolutions</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f8fa;color:#173042}header{background:#062f52;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #dbe7ec;border-radius:14px;padding:18px;box-shadow:0 4px 15px #1231  }.num{font-size:28px;font-weight:800;margin-top:8px}table{width:100%;border-collapse:collapse;background:white;margin-top:20px;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #e7eef2}th{background:#eef5f7}.ok{color:#087f62;font-weight:700}.warn{color:#a56a00;font-weight:700}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:#087f8e;color:white;text-decoration:none;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:13px}}@media(max-width:520px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header><strong>ITExpresSolutions</strong><a class="btn" href="/admin-dashboard.html">← Dashboard</a></header><main><h1>Activos e Inventario</h1><p>Control central de equipos y activos para conectar CSM, ERP e ITSM.</p><div class="grid"><div class="card">Total de activos<div class="num" id="total">—</div></div><div class="card">Activos operativos<div class="num" id="active">—</div></div><div class="card">En mantenimiento<div class="num" id="maint">—</div></div><div class="card">En almacén<div class="num" id="store">—</div></div></div><table><thead><tr><th>Activo</th><th>Marca / modelo</th><th>Serie</th><th>Cliente</th><th>Estado</th></tr></thead><tbody id="rows"><tr><td colspan="5">Cargando activos…</td></tr></tbody></table></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://wfdxbgohwejawmkpninz.supabase.co',KEY='';const rows=document.getElementById('rows');async function load(){try{if(!window.supabase||!KEY){rows.innerHTML='<tr><td colspan="5">La conexión a Supabase debe usar la configuración segura existente del portal.</td></tr>';return}const sb=supabase.createClient(URL,KEY);const {data,error}=await sb.from('activos').select('*').order('created_at',{ascending:false});if(error)throw error;document.getElementById('total').textContent=data.length;document.getElementById('active').textContent=data.filter(x=>['activo','operativo'].includes(String(x.estado||'').toLowerCase())).length;document.getElementById('maint').textContent=data.filter(x=>String(x.estado||'').toLowerCase().includes('mantenimiento')).length;document.getElementById('store').textContent=data.filter(x=>String(x.estado||'').toLowerCase().includes('almac')).length;rows.innerHTML=data.length?data.map(x=>`<tr><td>${x.nombre||x.asset_tag||x.id||'—'}</td><td>${[x.marca,x.modelo].filter(Boolean).join(' / ')||'—'}</td><td>${x.numero_serie||x.serie||'—'}</td><td>${x.cliente_nombre||x.cliente_id||'—'}</td><td class="${String(x.estado).toLowerCase().includes('mantenimiento')?'warn':'ok'}">${x.estado||'—'}</td></tr>`).join(''):'<tr><td colspan="5">No hay activos registrados todavía.</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="5">No se pudieron cargar los activos: ${e.message}</td></tr>`}}load();</script></body></html>
